<!DOCTYPE html>
<html lang="en" class="scroll-smooth" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - ShiftPro Customer Portal</title>
  <meta name="description" content="Sign in to your ShiftPro customer portal to manage move bookings, track live truck GPS, and download invoices.">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              300: '#6ee7b7',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
              950: '#022c22'
            },
            accent: {
              50: '#ecfeff',
              100: '#cffafe',
              200: '#a5f3fc',
              300: '#67e8f9',
              400: '#22d3ee',
              500: '#06b6d4',
              600: '#0891b2',
              700: '#0e7490',
              800: '#155e75',
              950: '#083344'
            }
          }
        }
      }
    };
  </script>

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
</head>
<body class="bg-body text-main min-h-screen flex flex-col justify-between transition-colors duration-200 relative">

  <!-- Floating Utility Controls (Theme/RTL Toggles) -->
  <div class="w-full px-6 py-4 flex items-center justify-end z-30">
    <div class="flex items-center gap-2.5">
      <button class="rtl-toggle-btn px-2.5 py-1.5 rounded-lg bg-surface/80 backdrop-blur-md border border-custom text-xs font-bold hover:bg-surface-secondary transition-colors" title="Toggle RTL">RTL</button>
      <button class="theme-toggle-btn p-2 rounded-lg bg-surface/80 backdrop-blur-md border border-custom hover:bg-surface-secondary text-slate-600 dark:text-slate-300 transition-colors">
        <i class="fa-solid fa-moon"></i>
        <i class="fa-solid fa-sun hidden text-amber-400"></i>
      </button>
    </div>
  </div>

  <!-- Login Card Container with Ambient Background Glow -->
  <div class="relative py-6 sm:py-10 px-4 flex items-center justify-center flex-grow overflow-hidden">
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[550px] h-[550px] bg-gradient-to-tr from-brand-600/20 via-cyan-500/10 to-accent-500/10 rounded-full blur-3xl pointer-events-none -z-10"></div>

    <div class="w-full max-w-md bg-surface/95 backdrop-blur-xl p-8 sm:p-9 rounded-3xl border border-custom shadow-2xl space-y-6 relative z-10">
      
      <!-- Brand Logo Fitted Inside Card Container -->
      <div class="text-center space-y-3">
        <a href="index.html" class="inline-flex items-center justify-center mx-auto focus:outline-none">
          <img src="assets/images/logo.svg" alt="ShiftPro Logo" class="h-11 sm:h-12 w-auto dark:hidden">
          <img src="assets/images/logo-light.svg" alt="ShiftPro Logo" class="h-11 sm:h-12 w-auto hidden dark:block">
        </a>
        <div class="space-y-1">
          <h1 class="text-2xl sm:text-3xl font-extrabold text-main tracking-tight">Welcome Back</h1>
          <p class="text-xs text-muted-custom">Sign in to manage your moves, invoices, and live tracking</p>
        </div>
      </div>

      <!-- Additional Sign In Options (Social Login) -->
      <div class="space-y-3">
        <div class="grid grid-cols-2 gap-3">
          <button type="button" onclick="socialLogin('Google')" class="flex items-center justify-center gap-2.5 py-2.5 px-3 rounded-xl border border-custom bg-surface-secondary/60 hover:bg-surface-secondary text-main text-xs font-bold transition-all shadow-xs hover:border-brand-500 hover:scale-[1.01]">
            <svg class="w-4 h-4" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <span>Google</span>
          </button>
          
          <button type="button" onclick="socialLogin('Apple')" class="flex items-center justify-center gap-2.5 py-2.5 px-3 rounded-xl border border-custom bg-surface-secondary/60 hover:bg-surface-secondary text-main text-xs font-bold transition-all shadow-xs hover:border-brand-500 hover:scale-[1.01]">
            <i class="fa-brands fa-apple text-base text-slate-800 dark:text-white"></i>
            <span>Apple ID</span>
          </button>
        </div>

        <!-- Divider -->
        <div class="relative flex items-center justify-center pt-1">
          <div class="border-t border-custom w-full"></div>
          <span class="bg-surface px-3 text-[11px] font-semibold text-muted-custom uppercase tracking-wider absolute">or email sign in</span>
        </div>
      </div>

      <!-- Quick Demo Login Presets -->
      <div class="p-3.5 rounded-2xl bg-brand-50/60 dark:bg-slate-900/60 border border-brand-100 dark:border-slate-800 space-y-2">
        <div class="flex items-center justify-center gap-1.5 text-[10px] font-extrabold text-brand-600 dark:text-indigo-400 uppercase tracking-widest">
          <i class="fa-solid fa-wand-magic-sparkles text-xs"></i> 1-Click Demo Login
        </div>
        <button type="button" onclick="quickFillLogin('customer')" class="w-full btn-demo-customer py-2.5 px-3 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-2 shadow-md hover:scale-[1.01]">
          <i class="fa-solid fa-user-check text-emerald-400"></i> Auto-Fill Customer Demo Credentials
        </button>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="space-y-4 text-xs">
        <div>
          <label class="block font-bold text-muted-custom mb-1 uppercase tracking-wider text-[11px]">Email Address</label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-brand-600"></i>
            <input type="email" id="login-email" required value="customer@shiftpro.com" class="custom-input pl-10 text-xs font-medium">
          </div>
        </div>

        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="font-bold text-muted-custom uppercase tracking-wider text-[11px]">Password</label>
            <a href="#" onclick="showToast('Password reset link sent to your email!', 'info'); return false;" class="text-brand-600 hover:underline text-[11px] font-semibold">Forgot password?</a>
          </div>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-brand-600"></i>
            <input type="password" id="login-pass" required value="password123" class="custom-input pl-10 pr-10 text-xs font-medium">
            <button type="button" onclick="togglePassVisibility()" class="absolute right-3.5 top-3 text-slate-400 hover:text-slate-600">
              <i class="fa-regular fa-eye" id="pass-eye"></i>
            </button>
          </div>
        </div>

        <div class="flex items-center gap-2 pt-1">
          <input type="checkbox" id="remember-me" checked class="w-4 h-4 rounded text-brand-600 accent-brand-600">
          <label for="remember-me" class="text-xs text-muted-custom font-medium cursor-pointer">Remember this device</label>
        </div>

        <button type="submit" class="btn-brand-primary w-full py-3.5 text-white font-bold rounded-xl text-sm transition-all shadow-lg hover:scale-[1.01] flex items-center justify-center gap-2">
          <span>Sign In to Dashboard</span>
          <i class="fa-solid fa-arrow-right text-xs"></i>
        </button>
      </form>

      <!-- Register Link -->
      <div class="text-center text-xs text-muted-custom pt-3 border-t border-custom font-medium">
        Don't have an account? <a href="register.html" class="font-bold text-brand-600 dark:text-indigo-400 hover:underline">Create Account</a>
      </div>

    </div>
  </div>

  <!-- Footer Simple -->
  <div class="p-4 text-center text-xs text-slate-500 border-t border-custom font-medium">
    © 2026 ShiftPro Relocation Services Inc. All rights reserved.
  </div>

  <script src="assets/js/main.js"></script>
  <script>
    function socialLogin(provider) {
      if (typeof showToast === 'function') {
        showToast(`Connecting with ${provider} Secure SSO...`, 'info');
      }
      setTimeout(() => {
        localStorage.setItem('shiftpro_logged_in', 'true');
        localStorage.setItem('shiftpro_user_email', `sarah.${provider.toLowerCase()}@example.com`);
        if (typeof showToast === 'function') {
          showToast(`Successfully signed in via ${provider}!`, 'success');
        }
        setTimeout(() => { window.location.href = 'index.html'; }, 800);
      }, 700);
    }
  </script>
</body>
</html>
